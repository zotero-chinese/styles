name: 样式申请
description: 申请添加新的 CSL 样式
title: "新样式："
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        ## 样式信息

  - type: input
    attributes:
      label: 期刊 / 学校名称
      placeholder: XX学报 / XX大学（研究生学位论文）
    validations:
      required: true

  - type: textarea
    attributes:
      label: 参考文献格式
      description: 提供**官网**的链接，并上传一份格式文件。
      value: |
        官方网页链接：

        官方文件链接：

        上传格式文件：
    validations:
      required: true

  - type: dropdown
    attributes:
      label: 相关领域
      description: 参考 `CONTRIBUTING.md` 第 4 节；多学科样式可选主要领域。
      options:
        - generic-base（※通用基础）
        - anthropology（人类学）
        - astronomy（天文学）
        - biology（生物学）
        - botany（植物学）
        - chemistry（化学）
        - communications（传播学）
        - engineering（工程学）
        - geography（地理学）
        - geology（地质学）
        - history（历史学）
        - humanities（人文学科）
        - law（法学）
        - linguistics（语言学）
        - literature（文学）
        - math（数学）
        - medicine（医学）
        - philosophy（哲学）
        - physics（物理学）
        - political_science（政治学）
        - psychology（心理学）
        - science（自然科学）
        - social_science（社会科学）
        - sociology（社会学）
        - theology（神学）
        - zoology（动物学）

  - type: textarea
    attributes:
      label: 文件号
      description: 上述格式文件的编号或期刊 ISSN 号，例如“`研生[2019]10号`”或“`0439-755X`”。
      value: |
        - （期刊）ISSN 号：
        - （学校）文件号：
        - 参考文献格式的更新日期：

  - type: textarea
    attributes:
      label: 相近样式
      description: 请在 https://zotero-chinese.com/styles 的通用样式（如国标、《综合性期刊文献引证技术规范》）中查找与你需要的最相近的样式，将链接或样式名填写在下面，并简要说明与其差别。
      value: |
        相近样式：

        区别：
