name: autofix.ci # needed to securely identify the workflow

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  autofix:
    name: 自动修复格式和预览
    uses: zotero-plugin-dev/workflows/.github/workflows/autofix.yml@main
    with:
      fetch-all: true
      command: pnpm format:csl && pnpm build

  validate:
    name: 校验样式
    if: always()
    needs: autofix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm validate
